apiVersion: v1
kind: Namespace
metadata:
  name: node-inventory-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-inventory-controller
  namespace: node-inventory-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-inventory-controller
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [infra.fai.devops]
  resources: [nodeinventories]
  verbs: [get, list, watch]
- apiGroups: [infra.fai.devops]
  resources: [nodeinventories/status]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-inventory-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-inventory-controller
subjects:
- kind: ServiceAccount
  name: node-inventory-controller
  namespace: node-inventory-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-inventory-leader-election
  namespace: node-inventory-system
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-inventory-leader-election
  namespace: node-inventory-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-inventory-leader-election
subjects:
- kind: ServiceAccount
  name: node-inventory-controller
  namespace: node-inventory-system
